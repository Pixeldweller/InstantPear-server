server.port=9274
websocket.sockjs.enabled=true

# Secondary HTTPS connector with auto-generated self-signed cert.
# Clients must accept the cert (CEF cert-error bypass on plugin side).
pear.https.enabled=true
pear.https.port=9275

# Logging
logging.level.root=WARN
logging.level.com.pixeldweller.instantpear=INFO
logging.level.org.springframework.web.socket=INFO
